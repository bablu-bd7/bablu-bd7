<svg xmlns="http://www.w3.org/2000/svg" width="460" height="300" viewBox="0 0 460 300" role="img" aria-label="Builder Pass: Bhagaban, Full-Stack Developer">
  <style>
    .float { animation: float 6.5s ease-in-out infinite; transform-origin: 230px 150px; }
    @keyframes float {
      0%,100% { transform: translateY(0) rotate(-1.5deg); }
      50% { transform: translateY(-12px) rotate(1.5deg); }
    }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .sans { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    @media (prefers-reduced-motion: reduce) { .float { animation: none; } }
  </style>
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E5FF"/><stop offset="0.55" stop-color="#168BFF"/><stop offset="1" stop-color="#815BFF"/>
    </linearGradient>
    <linearGradient id="f" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0A182C"/><stop offset="1" stop-color="#060E1B"/>
    </linearGradient>
  </defs>
  <g class="float">
    <rect x="30" y="24" width="400" height="252" rx="18" fill="url(#f)" stroke="url(#b)" stroke-width="1.5"/>
    <text x="54" y="62" class="sans" font-size="22" font-weight="700" letter-spacing="3" fill="#F1F7FF">BUILDER PASS</text>
    <text x="54" y="82" class="mono" font-size="10" letter-spacing="3" fill="#00E5FF">DIGITAL DEVELOPER IDENTITY</text>
    <text x="406" y="58" class="mono" font-size="11" fill="#00E5FF" text-anchor="end">#BP-007</text>
    <rect x="54" y="104" width="84" height="84" rx="12" fill="#0D1B2D" stroke="#00E5FF" stroke-opacity="0.6"/>
    <text x="96" y="160" class="sans" font-size="40" font-weight="700" fill="#00E5FF" text-anchor="middle">B</text>
    <text x="158" y="116" class="mono" font-size="9" letter-spacing="2" fill="#5F7594">NAME</text>
    <text x="158" y="134" class="sans" font-size="16" fill="#F1F7FF">BHAGABAN</text>
    <text x="158" y="156" class="mono" font-size="9" letter-spacing="2" fill="#5F7594">ROLE</text>
    <text x="158" y="174" class="sans" font-size="14" fill="#F1F7FF">Full-Stack Developer</text>
    <line x1="54" y1="204" x2="406" y2="204" stroke="#16365B"/>
    <text x="54" y="226" class="sans" font-size="12" fill="#93A9C7">B.Tech Computer Science &amp; Engineering</text>
    <text x="54" y="244" class="mono" font-size="10" letter-spacing="2" fill="#00E5FF">LEARN / BUILD / INNOVATE</text>
    <text x="406" y="262" class="mono" font-size="8" letter-spacing="2" fill="#00E5FF" text-anchor="end">BUILDING A BETTER TOMORROW</text>
  </g>
</svg>
