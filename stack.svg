<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 860 400" width="860" height="400">
  <defs>
    <style>
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        animateTransform { dur: 0s !important; }
      }
      .bg { fill: #070b16; }
      .card { fill: #0d1526; }
      .sans { font-family: "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "Courier New", Courier, monospace; }

      /* Orbit rotations */
      .orbit1 { animation: orb1 14s linear infinite; transform-origin: 300px 200px; }
      .orbit2 { animation: orb2 20s linear infinite; transform-origin: 300px 200px; }
      .orbit3 { animation: orb3 28s linear infinite reverse; transform-origin: 300px 200px; }

      /* Icon counter-rotation so labels stay upright */
      .counter1 { animation: counterOrb1 14s linear infinite; }
      .counter2 { animation: counterOrb2 20s linear infinite; }
      .counter3 { animation: counterOrb3 28s linear infinite reverse; }

      .chips-col { opacity: 0; animation: fadeUp 0.7s 0.5s ease both; }
      .orbit-group { opacity: 0; animation: fadeIn 0.9s 0.3s ease both; }

      @keyframes orb1 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes orb2 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes orb3 { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
      @keyframes counterOrb1 { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
      @keyframes counterOrb2 { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
      @keyframes counterOrb3 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes fadeUp { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }
      @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    </style>
    <linearGradient id="sk_borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>
    <linearGradient id="sk_chipGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1f3d"/>
      <stop offset="100%" stop-color="#0d1526"/>
    </linearGradient>
  </defs>

  <rect width="860" height="400" class="bg" rx="16"/>
  <rect x="1" y="1" width="858" height="398" rx="15" fill="none"
        stroke="url(#sk_borderGrad)" stroke-width="1.2" opacity="0.5"/>

  <!-- Section Title -->
  <text x="30" y="38" class="sans" font-size="13" font-weight="600" fill="#247bff" letter-spacing="3">
    TECH STACK
  </text>

  <!-- ===== ORBIT ZONE (left 580px) ===== -->
  <g class="orbit-group">

  <!-- Orbit ellipse paths (visual guide) -->
  <!-- Orbit 1 - inner, slight tilt -->
  <ellipse cx="300" cy="205" rx="88" ry="44" fill="none"
           stroke="#1a2a4a" stroke-width="1" stroke-dasharray="4,6"
           transform="rotate(-12, 300, 205)"/>
  <!-- Orbit 2 - middle -->
  <ellipse cx="300" cy="205" rx="148" ry="72" fill="none"
           stroke="#1a2a4a" stroke-width="1" stroke-dasharray="4,6"
           transform="rotate(-8, 300, 205)"/>
  <!-- Orbit 3 - outer -->
  <ellipse cx="300" cy="205" rx="218" ry="100" fill="none"
           stroke="#1a2a4a" stroke-width="1" stroke-dasharray="4,6"
           transform="rotate(-5, 300, 205)"/>

  <!-- Center hub -->
  <circle cx="300" cy="205" r="36" fill="#0d1f3d" stroke="#247bff" stroke-width="1.5"/>
  <text x="300" y="199" class="sans" font-size="10" font-weight="700" fill="#247bff"
        text-anchor="middle">BABLU</text>
  <text x="300" y="214" class="sans" font-size="9" fill="#6b8aad" text-anchor="middle">BD7</text>

  <!-- ORBIT 1 icons (3 items, inner ring) - HTML, CSS, JS -->
  <!-- HTML5 - orange -->
  <g class="orbit1" transform-origin="300 205">
    <g transform="translate(300,205)">
      <g transform="translate(88,0) rotate(-12)" class="counter1" transform-origin="0 0">
        <circle r="22" fill="#e34f26" opacity="0.92"/>
        <text y="5" text-anchor="middle" class="sans" font-size="9" font-weight="700" fill="white">HTML5</text>
      </g>
    </g>
  </g>
  <!-- CSS3 - blue -->
  <g style="transform: rotate(120deg); transform-origin: 300px 205px; animation: orb1 14s linear infinite; animation-delay: -4.67s;">
    <g transform="translate(300,205)">
      <g transform="translate(88,0) rotate(-12)">
        <circle r="22" fill="#1572b6" opacity="0.92"/>
        <text y="5" text-anchor="middle" class="sans" font-size="9" font-weight="700" fill="white">CSS3</text>
      </g>
    </g>
  </g>
  <!-- JS - yellow -->
  <g style="transform: rotate(240deg); transform-origin: 300px 205px; animation: orb1 14s linear infinite; animation-delay: -9.33s;">
    <g transform="translate(300,205)">
      <g transform="translate(88,0) rotate(-12)">
        <circle r="22" fill="#f7df1e" opacity="0.95"/>
        <text y="5" text-anchor="middle" class="sans" font-size="9" font-weight="700" fill="#000">JS</text>
      </g>
    </g>
  </g>

  <!-- ORBIT 2 icons (4 items, middle ring) - Tailwind, Kotlin, Firebase, Node.js -->
  <!-- Tailwind -->
  <g style="animation: orb2 20s linear infinite; transform-origin: 300px 205px;">
    <g transform="translate(300,205)">
      <g transform="translate(148,0) rotate(-8)">
        <circle r="24" fill="#06b6d4" opacity="0.92"/>
        <text y="4" text-anchor="middle" class="sans" font-size="8" font-weight="700" fill="white">Tailwind</text>
      </g>
    </g>
  </g>
  <!-- Kotlin -->
  <g style="transform: rotate(90deg); transform-origin: 300px 205px; animation: orb2 20s linear infinite; animation-delay: -5s;">
    <g transform="translate(300,205)">
      <g transform="translate(148,0) rotate(-8)">
        <circle r="24" fill="#7f52ff" opacity="0.92"/>
        <text y="4" text-anchor="middle" class="sans" font-size="8" font-weight="700" fill="white">Kotlin</text>
      </g>
    </g>
  </g>
  <!-- Firebase -->
  <g style="transform: rotate(180deg); transform-origin: 300px 205px; animation: orb2 20s linear infinite; animation-delay: -10s;">
    <g transform="translate(300,205)">
      <g transform="translate(148,0) rotate(-8)">
        <circle r="24" fill="#ffca28" opacity="0.92"/>
        <text y="4" text-anchor="middle" class="sans" font-size="8" font-weight="700" fill="#333">Firebase</text>
      </g>
    </g>
  </g>
  <!-- Node.js -->
  <g style="transform: rotate(270deg); transform-origin: 300px 205px; animation: orb2 20s linear infinite; animation-delay: -15s;">
    <g transform="translate(300,205)">
      <g transform="translate(148,0) rotate(-8)">
        <circle r="24" fill="#339933" opacity="0.92"/>
        <text y="4" text-anchor="middle" class="sans" font-size="8" font-weight="700" fill="white">Node.js</text>
      </g>
    </g>
  </g>

  <!-- ORBIT 3 icons (3 items, outer ring) - Python, Jetpack Compose, Vanilla JS -->
  <!-- Python -->
  <g style="animation: orb3 28s linear infinite reverse; transform-origin: 300px 205px;">
    <g transform="translate(300,205)">
      <g transform="translate(218,0) rotate(-5)">
        <circle r="26" fill="#3776ab" opacity="0.92"/>
        <text y="4" text-anchor="middle" class="sans" font-size="8.5" font-weight="700" fill="white">Python</text>
      </g>
    </g>
  </g>
  <!-- Jetpack Compose -->
  <g style="transform: rotate(120deg); transform-origin: 300px 205px; animation: orb3 28s linear infinite reverse; animation-delay: -9.33s;">
    <g transform="translate(300,205)">
      <g transform="translate(218,0) rotate(-5)">
        <circle r="26" fill="#4285f4" opacity="0.92"/>
        <text y="0" text-anchor="middle" class="sans" font-size="7.5" font-weight="700" fill="white">Jetpack</text>
        <text y="11" text-anchor="middle" class="sans" font-size="7.5" font-weight="700" fill="white">Compose</text>
      </g>
    </g>
  </g>
  <!-- Vanilla JS extra -->
  <g style="transform: rotate(240deg); transform-origin: 300px 205px; animation: orb3 28s linear infinite reverse; animation-delay: -18.67s;">
    <g transform="translate(300,205)">
      <g transform="translate(218,0) rotate(-5)">
        <circle r="26" fill="#ff354f" opacity="0.85"/>
        <text y="0" text-anchor="middle" class="sans" font-size="7.5" font-weight="700" fill="white">Vanilla</text>
        <text y="11" text-anchor="middle" class="sans" font-size="7.5" font-weight="700" fill="white">JS</text>
      </g>
    </g>
  </g>

  </g><!-- end orbit-group -->

  <!-- ===== CHIP COLUMN (right side) ===== -->
  <g class="chips-col">
    <text x="610" y="48" class="sans" font-size="12" font-weight="600"
          fill="#6b8aad" letter-spacing="2">GROUPED STACK</text>

    <!-- Frontend group -->
    <text x="610" y="74" class="sans" font-size="11" fill="#247bff" font-weight="700">Frontend</text>
    <!-- chips -->
    <rect x="610" y="82" width="68" height="24" rx="12" fill="#0d1f3d" stroke="#247bff" stroke-width="0.8"/>
    <text x="644" y="98" class="sans" font-size="10.5" fill="#c8d8f0" text-anchor="middle">HTML5</text>
    <rect x="684" y="82" width="56" height="24" rx="12" fill="#0d1f3d" stroke="#247bff" stroke-width="0.8"/>
    <text x="712" y="98" class="sans" font-size="10.5" fill="#c8d8f0" text-anchor="middle">CSS3</text>
    <rect x="746" y="82" width="42" height="24" rx="12" fill="#0d1f3d" stroke="#247bff" stroke-width="0.8"/>
    <text x="767" y="98" class="sans" font-size="10.5" fill="#c8d8f0" text-anchor="middle">JS</text>
    <rect x="610" y="112" width="80" height="24" rx="12" fill="#0d1f3d" stroke="#06b6d4" stroke-width="0.8"/>
    <text x="650" y="128" class="sans" font-size="10.5" fill="#c8d8f0" text-anchor="middle">Tailwind CSS</text>

    <!-- Android group -->
    <text x="610" y="158" class="sans" font-size="11" fill="#7f52ff" font-weight="700">Android</text>
    <rect x="610" y="166" width="56" height="24" rx="12" fill="#0d1f3d" stroke="#7f52ff" stroke-width="0.8"/>
    <text x="638" y="182" class="sans" font-size="10.5" fill="#c8d8f0" text-anchor="middle">Kotlin</text>
    <rect x="672" y="166" width="116" height="24" rx="12" fill="#0d1f3d" stroke="#7f52ff" stroke-width="0.8"/>
    <text x="730" y="182" class="sans" font-size="10.5" fill="#c8d8f0" text-anchor="middle">Jetpack Compose</text>

    <!-- Backend / Cloud -->
    <text x="610" y="212" class="sans" font-size="11" fill="#339933" font-weight="700">Backend &amp; Cloud</text>
    <rect x="610" y="220" width="62" height="24" rx="12" fill="#0d1f3d" stroke="#339933" stroke-width="0.8"/>
    <text x="641" y="236" class="sans" font-size="10.5" fill="#c8d8f0" text-anchor="middle">Node.js</text>
    <rect x="678" y="220" width="62" height="24" rx="12" fill="#0d1f3d" stroke="#ffca28" stroke-width="0.8"/>
    <text x="709" y="236" class="sans" font-size="10.5" fill="#c8d8f0" text-anchor="middle">Firebase</text>
    <rect x="746" y="220" width="56" height="24" rx="12" fill="#0d1f3d" stroke="#3776ab" stroke-width="0.8"/>
    <text x="774" y="236" class="sans" font-size="10.5" fill="#c8d8f0" text-anchor="middle">Python</text>

    <!-- Tools -->
    <text x="610" y="268" class="sans" font-size="11" fill="#ff354f" font-weight="700">Tools &amp; Platforms</text>
    <rect x="610" y="276" width="52" height="24" rx="12" fill="#0d1f3d" stroke="#ff354f" stroke-width="0.8"/>
    <text x="636" y="292" class="sans" font-size="10.5" fill="#c8d8f0" text-anchor="middle">GitHub</text>
    <rect x="668" y="276" width="56" height="24" rx="12" fill="#0d1f3d" stroke="#ff354f" stroke-width="0.8"/>
    <text x="696" y="292" class="sans" font-size="10.5" fill="#c8d8f0" text-anchor="middle">Android</text>
    <rect x="730" y="276" width="62" height="24" rx="12" fill="#0d1f3d" stroke="#ff354f" stroke-width="0.8"/>
    <text x="761" y="292" class="sans" font-size="10.5" fill="#c8d8f0" text-anchor="middle">VS Code</text>

    <!-- Learning -->
    <rect x="610" y="316" width="180" height="24" rx="12" fill="#0d1526" stroke="#1a2a4a" stroke-width="0.8"/>
    <text x="700" y="332" class="sans" font-size="10" fill="#6b8aad" text-anchor="middle">🔭 Always exploring more...</text>
  </g>
</svg>