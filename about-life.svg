<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 860 320" width="860" height="320">
  <defs>
    <style>
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        animate, animateTransform { dur: 0s !important; }
      }
      .bg { fill: #070b16; }
      .card { fill: #0d1526; }
      .sans { font-family: "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "Courier New", Courier, monospace; }

      /* slide animations - 3 slides x 4s each = 12s cycle */
      .slide1 { animation: slide1anim 12s 0.5s step-start infinite both; }
      .slide2 { animation: slide2anim 12s 0.5s step-start infinite both; }
      .slide3 { animation: slide3anim 12s 0.5s step-start infinite both; }

      /* progress bars for segment indicators */
      .seg1 { animation: seg1prog 4s 0.5s linear infinite both; }
      .seg2 { animation: seg2prog 4s 4.5s linear infinite both; }
      .seg3 { animation: seg3prog 4s 8.5s linear infinite both; }

      /* entrance */
      .caps-col { opacity: 0; animation: fadeUp 0.7s 0.3s ease both; }
      .carousel  { opacity: 0; animation: fadeIn 0.8s 0.5s ease both; }

      @keyframes fadeUp {
        from { opacity:0; transform: translateY(12px); }
        to   { opacity:1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity:0; } to { opacity:1; }
      }
      @keyframes slide1anim {
        0%,32%   { opacity:1; }
        33%,100% { opacity:0; }
      }
      @keyframes slide2anim {
        0%,32%   { opacity:0; }
        33%,65%  { opacity:1; }
        66%,100% { opacity:0; }
      }
      @keyframes slide3anim {
        0%,65%   { opacity:0; }
        66%,99%  { opacity:1; }
        100%     { opacity:0; }
      }
      @keyframes seg1prog {
        from { width: 0; } to { width: 84px; }
      }
      @keyframes seg2prog {
        from { width: 0; } to { width: 84px; }
      }
      @keyframes seg3prog {
        from { width: 0; } to { width: 84px; }
      }
    </style>
    <linearGradient id="ab_borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>
    <linearGradient id="ab_barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="860" height="320" class="bg" rx="16"/>
  <rect x="1" y="1" width="858" height="318" rx="15" fill="none"
        stroke="url(#ab_borderGrad)" stroke-width="1.2" opacity="0.6"/>

  <!-- Section Title -->
  <text x="30" y="38" class="sans" font-size="13" font-weight="600" fill="#247bff" letter-spacing="3">
    ABOUT ME
  </text>

  <!-- LEFT: Capabilities -->
  <g class="caps-col">
    <!-- Card bg -->
    <rect x="24" y="52" width="370" height="248" rx="12" class="card" opacity="0.7"/>
    <rect x="24" y="52" width="370" height="248" rx="12" fill="none"
          stroke="#1a2a4a" stroke-width="1"/>

    <!-- Cap items -->
    <g font-family="Segoe UI,Arial,sans-serif" font-size="13.5" fill="#c8d8f0">
      <!-- item 1 -->
      <rect x="40" y="74" width="32" height="32" rx="8" fill="#0f1f3d"/>
      <text x="47" y="95" font-size="17">🌐</text>
      <text x="82" y="87" font-weight="600" fill="#f0f4ff">Web Development</text>
      <text x="82" y="103" font-size="11.5" fill="#6b8aad">HTML5 · CSS3 · JS · Tailwind · Node.js</text>

      <!-- item 2 -->
      <rect x="40" y="118" width="32" height="32" rx="8" fill="#0f1f3d"/>
      <text x="47" y="139" font-size="17">📱</text>
      <text x="82" y="131" font-weight="600" fill="#f0f4ff">Android Development</text>
      <text x="82" y="147" font-size="11.5" fill="#6b8aad">Kotlin · Jetpack Compose · Firebase</text>

      <!-- item 3 -->
      <rect x="40" y="162" width="32" height="32" rx="8" fill="#0f1f3d"/>
      <text x="47" y="183" font-size="17">🔒</text>
      <text x="82" y="175" font-weight="600" fill="#f0f4ff">Secure App Design</text>
      <text x="82" y="191" font-size="11.5" fill="#6b8aad">Temp mail · DNS filtering · VPN API</text>

      <!-- item 4 -->
      <rect x="40" y="206" width="32" height="32" rx="8" fill="#0f1f3d"/>
      <text x="47" y="227" font-size="17">🤖</text>
      <text x="82" y="219" font-weight="600" fill="#f0f4ff">AI-Powered Tools</text>
      <text x="82" y="235" font-size="11.5" fill="#6b8aad">Interview sim · skill eval · automation</text>

      <!-- item 5 -->
      <rect x="40" y="250" width="32" height="32" rx="8" fill="#0f1f3d"/>
      <text x="47" y="271" font-size="17">🎓</text>
      <text x="82" y="263" font-weight="600" fill="#f0f4ff">Content Creation</text>
      <text x="82" y="279" font-size="11.5" fill="#6b8aad">Tech tutorials · AI Dev channel</text>
    </g>
  </g>

  <!-- RIGHT: Interests Carousel -->
  <g class="carousel">
    <rect x="412" y="52" width="424" height="248" rx="12" class="card" opacity="0.7"/>
    <rect x="412" y="52" width="424" height="248" rx="12" fill="none"
          stroke="#1a2a4a" stroke-width="1"/>

    <text x="428" y="78" class="sans" font-size="12" font-weight="600"
          fill="#247bff" letter-spacing="2">INTERESTS</text>

    <!-- Slide 1: Android ROM modding -->
    <g class="slide1">
      <text x="428" y="118" class="sans" font-size="28">🛠️</text>
      <text x="470" y="115" class="sans" font-size="16" font-weight="700" fill="#f0f4ff">
        Android Customization
      </text>
      <text x="470" y="133" class="sans" font-size="12" fill="#6b8aad">
        ROM modding · system tweaks
      </text>
      <text x="428" y="165" class="sans" font-size="12.5" fill="#a0b4d0">
        Deep into Android internals — custom ROMs,
      </text>
      <text x="428" y="182" class="sans" font-size="12.5" fill="#a0b4d0">
        kernel tweaks, and system-level hacks.
      </text>
      <text x="428" y="199" class="sans" font-size="12.5" fill="#a0b4d0">
        If it runs AOSP, I have probably modded it.
      </text>
    </g>

    <!-- Slide 2: Gaming -->
    <g class="slide2">
      <text x="428" y="118" class="sans" font-size="28">🎮</text>
      <text x="470" y="115" class="sans" font-size="16" font-weight="700" fill="#f0f4ff">
        Tactical Mobile Gaming
      </text>
      <text x="470" y="133" class="sans" font-size="12" fill="#6b8aad">
        Free Fire MAX enthusiast
      </text>
      <text x="428" y="165" class="sans" font-size="12.5" fill="#a0b4d0">
        Strategy, quick reflexes, and team play.
      </text>
      <text x="428" y="182" class="sans" font-size="12.5" fill="#a0b4d0">
        Free Fire MAX is the proving ground.
      </text>
      <text x="428" y="199" class="sans" font-size="12.5" fill="#a0b4d0">
        Clutch mode: always on.
      </text>
    </g>

    <!-- Slide 3: Anime + Tutorials -->
    <g class="slide3">
      <text x="428" y="118" class="sans" font-size="28">✨</text>
      <text x="470" y="115" class="sans" font-size="16" font-weight="700" fill="#f0f4ff">
        Anime &amp; Tech Tutorials
      </text>
      <text x="470" y="133" class="sans" font-size="12" fill="#6b8aad">
        AI Dev Tech channel creator
      </text>
      <text x="428" y="165" class="sans" font-size="12.5" fill="#a0b4d0">
        Anime for inspiration, tutorials for impact.
      </text>
      <text x="428" y="182" class="sans" font-size="12.5" fill="#a0b4d0">
        Sharing AI and dev knowledge through video
      </text>
      <text x="428" y="199" class="sans" font-size="12.5" fill="#a0b4d0">
        on the AI Dev Tech YouTube channel.
      </text>
    </g>

    <!-- Segment progress indicators -->
    <text x="428" y="268" class="sans" font-size="10" fill="#6b8aad">BROWSING</text>

    <!-- Seg 1 bar bg -->
    <rect x="480" y="258" width="84" height="4" rx="2" fill="#1a2a4a"/>
    <rect x="480" y="258" height="4" rx="2" fill="url(#ab_barGrad)" class="seg1"/>

    <!-- Seg 2 bar bg -->
    <rect x="572" y="258" width="84" height="4" rx="2" fill="#1a2a4a"/>
    <rect x="572" y="258" height="4" rx="2" fill="url(#ab_barGrad)" class="seg2"/>

    <!-- Seg 3 bar bg -->
    <rect x="664" y="258" width="84" height="4" rx="2" fill="#1a2a4a"/>
    <rect x="664" y="258" height="4" rx="2" fill="url(#ab_barGrad)" class="seg3"/>

    <!-- Dot indicators -->
    <circle cx="490" cy="278" r="3" fill="#247bff" opacity="0.9"/>
    <circle cx="506" cy="278" r="3" fill="#1a2a4a"/>
    <circle cx="522" cy="278" r="3" fill="#1a2a4a"/>
  </g>
</svg>